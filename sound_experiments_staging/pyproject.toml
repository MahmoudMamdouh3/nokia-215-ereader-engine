[project]
name = "sound-experiments"
version = "0.0.1"
description = "Audio-AI lab: voice datasets, voice conversion, singing studio, music generation"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are added in Phase 0 after the GPU/Windows smoke test and pinned in uv.lock.
dependencies = [
    "gradio>=6.0.0",
    "typer>=0.15.0",
    "rich>=14.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
]

[project.scripts]
soundlab = "soundlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundlab"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

